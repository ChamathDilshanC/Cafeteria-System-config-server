server:
  port: 8084

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:adminpassword}@${MONGO_HOST:localhost}:27017/kitchen_service_db?authSource=admin
      database: kitchen_service_db

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
