server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: git # Uses Git repository for centralized configurations
  cloud:
    config:
      server:
        git:
          uri: https://github.com/ChamathDilshanC/Cafeteria-System-Configurations.git
          default-label: main
          clone-on-start: true
          timeout: 10
          # For private repos, uncomment and set credentials:
          # username: ${GIT_USERNAME}
          # password: ${GIT_PASSWORD}
          search-paths:
            - platform
            - services

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh
  endpoint:
    health:
      show-details: always
